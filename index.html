<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Counter App</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <div class="container mx-auto min-h-screen grid place-items-center">

        <div class="w-96 max-w-[90%] border rounded shadow p-4">

            <div id="show" class="text-6xl text-center mb-4">
                00:00:00:00
            </div>

            <div class="flex text-center mt-2 gap-4 justify-center">

                <button class="border text-white px-4 py-2 rounded shadow cursor-pointer hover:bg-blue-600 bg-blue-400" id="start">
                    Start
                </button>

                <button class="border text-white px-4 py-2 rounded shadow cursor-pointer hover:bg-black bg-gray-500" id="reset">
                    Reset
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
